name = "mujflix-tmdb-proxy"
main = "tmdb-proxy.js"
compatibility_date = "2024-11-01"

[vars]
# Doplň svou doménu (Pages) a případně localhost pro vývoj
ALLOWED_ORIGINS = "https://mujflix.pages.dev,http://localhost:8080"

# Tajný klíč nastav příkazem (nedávej ho sem):
#   npx wrangler secret put TMDB_API_KEY

# Propojení zařízení (volitelné). Vytvoř úložiště a vlož jeho id:
#   npx wrangler kv namespace create SYNC
# [[kv_namespaces]]
# binding = "SYNC"
# id = "<id z předchozího příkazu>"
