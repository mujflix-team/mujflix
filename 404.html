<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <title>Stránka nenalezena | MůjFlix</title>
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <script>
  /* Záloha, kdyby hosting nepřepsal /s/, /f/, /c/ na index.html: pošli odkaz do aplikace. */
  (function () {
    var p = location.pathname;
    if (/^\/[sfc]\/[^\/]+/.test(p)) { document.documentElement.style.display = "none"; location.replace("/?mfp=" + encodeURIComponent(p)); }
  })();
</script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141414; color: #e5e5e5; font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px 16px; }
    .brand { font-weight: 800; font-size: 34px; letter-spacing: -.02em; margin: 0 0 28px; }
    .brand i { color: #0a84ff; font-style: normal; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 24px; color: #9a9a9a; }
    a.btn { display: inline-block; padding: 12px 28px; border-radius: 4px; background: #fff; color: #141414; font-weight: 700; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid #0a84ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Můj<i>Flix</i></p>
    <h1>Tuhle stránku jsme nenašli</h1>
    <p>Adresa nejspíš není správně, nebo stránka už neexistuje.</p>
    <a class="btn" href="/">Zpět na úvod</a>
  </main>
</body>
</html>
