# Dependabot hlídá zranitelnosti ve vývojářských závislostech (lint a testy) a verze akcí v CI.
# Do appky, kterou vidí uživatel, se žádná závislost nedostává (čisté HTML/CSS/JS bez buildu).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # eslint a @eslint/js musí mít stejnou hlavní verzi, proto je Dependabot po jednom nezvedá
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
