name: CI
# Spouští se při pull requestu a při změně na main (větev s pull requestem se tak nekontroluje dvakrát).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nový commit ve stejné větvi zruší rozběhnutou kontrolu, doběhne jen ta poslední.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Prohlížeč Playwrightu se ukládá do cache podle verze; při shodě se nestahuje znovu
      - id: pw
        run: echo "v=$(node -p \"require('playwright/package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run lint
      - run: npm test
